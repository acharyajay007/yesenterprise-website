name: yesenterprise

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8180}:8000"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    volumes:
      - .:/workspace
      - vendor:/workspace/website/vendor
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: local
      APP_NAME: Yes Enterprise Rajkot
      APP_URL: http://localhost:${DEV_HTTP_PORT:-8180}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: yesenterprise
      DB_USERNAME: yesenterprise
      DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in the root .env}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: preview@example.invalid
      MAIL_FROM_NAME: Yes Enterprise Rajkot development
      WEBSITE_ENQUIRY_RECIPIENT: preview@example.invalid
      WEBSITE_INDEXABLE: "false"
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      COMPOSER_PROCESS_TIMEOUT: 1200
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: yesenterprise
      MARIADB_USER: yesenterprise
      MARIADB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in the root .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  database:
  vendor:
  composer-cache:
